x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    ELECTRICITY_MAPS_TOKEN: 'C9WBF5z3XDr79Kv8TCQa'
    JAVA_HOME: /usr/lib/jvm/default-java
    _PIP_ADDITIONAL_REQUIREMENTS: 'pyspark==3.4.0 elasticsearch==8.12.0 requests'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy



services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 3

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      retries: 3

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      - elasticsearch


  spark:
    image: apache/spark-py:latest
    user: root
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    ports:
      - "8081:4040"
    command: tail -f /dev/null


  airflow-deps-installer:
    build: .
    user: "0:0"
    volumes:
      - airflow_deps:/opt/airflow/deps
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y default-jdk-headless -qq &&
        pip install pyspark==3.4.0 elasticsearch==8.12.0 requests -t /opt/airflow/deps &&
        echo 'Dependencies installed successfully'
      "


volumes:
  elasticsearch_data:
    driver: local
  airflow_deps:
    driver: local
  kibana_data:
    driver: local

  
    
